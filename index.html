<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Coffee Leaf Checker</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#2f6b3a">
<style>
:root{--g:#2f6b3a;--bg:#f4f8f1;--t:#1b2a1d;--a:#b26a00;--r:#a12a2a}
@media(prefers-color-scheme:dark){:root{--bg:#142016;--t:#e8f3e6}}
*{box-sizing:border-box}body{margin:0;font:18px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t);padding:16px;max-width:520px;margin:auto}
h1{font-size:22px;margin:4px 0}.row{display:flex;gap:8px;justify-content:space-between;align-items:center}
select,button,.btn{font:inherit;padding:14px;border-radius:12px;border:2px solid var(--g);background:#fff;color:#000}
.btn,button.p{background:var(--g);color:#fff;display:block;text-align:center;width:100%;margin:12px 0;font-weight:700}
img{max-width:100%;border-radius:12px}.card{background:#fff;color:#000;border-radius:12px;padding:14px;margin:12px 0;border-left:8px solid var(--g)}
.amber{border-color:var(--a)}.red{border-color:var(--r)}.bar{height:12px;background:#ddd;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
small{opacity:.8}[hidden]{display:none!important}.observation{background:#fff;color:#000;border-radius:12px;padding:12px;margin:12px 0}.observation img{width:100%;max-height:180px;object-fit:contain}.observation button,.observation a{display:inline-block;margin:6px 6px 0 0}
</style></head><body>
<div class="row"><h1 id="title"></h1><select id="lang"><option value="am">አማርኛ</option><option value="om">Afaan Oromoo</option><option value="en">English</option></select></div>
<small id="net"></small>
<p id="tip"></p>
<label class="btn" id="take"><input id="file" type="file" accept="image/*" capture="environment" hidden><span id="takeT"></span></label>
<div id="status"></div>
<div id="out" hidden><img id="pic" alt=""><div class="card" id="card"><b id="name" style="font-size:22px"></b>
<div id="confW"><small id="confL"></small><div class="bar"><i id="confB"></i></div></div><ol id="steps"></ol></div>
<button class="p" id="listen" hidden></button><button class="p" id="ask"></button><button id="again" style="width:100%"></button></div>
<section><h2 id="savedTitle"></h2><p id="saved" role="status"></p><div id="observations"></div></section>
<p><small id="disc"></small></p>
<script src="ort/ort.min.js"></script><script src="app.js"></script></body></html>
